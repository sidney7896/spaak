# Dependency build scripts are deliberately not executed (supply-chain hygiene); none are needed here.
allowBuilds:
  "@sentry/cli": false
  core-js: false
  unrs-resolver: false
# Security fix (06-10): source-map-js < 1.2.2 has a high-severity event-loop DoS (GHSA-68fv-2mgg-jv7q); build tooling only.
overrides:
  source-map-js: 1.2.2
